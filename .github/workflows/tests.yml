# Runs the whole test suite on every push to main and on every pull request,
# on the oldest supported Node.js (see "engines" in package.json) and the
# current one. The README's badge shows the latest result.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.13', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # The tests don't open the desktop app, so Electron's ~100 MB download
      # is skipped.
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test
